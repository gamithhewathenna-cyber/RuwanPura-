; Raises PHP upload limits for this site (used by the MP4 video upload field).
; Takes effect automatically on most cPanel hosts running PHP-FPM/LSAPI —
; may take a few minutes to apply. If uploads still fail, set these same
; values via cPanel -> MultiPHP INI Editor instead.
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
